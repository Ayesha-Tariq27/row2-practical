
apiVersion: apps/v1
kind: Deployment
metadata:
  name: laravel-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: laravel
  template:
    metadata:
      labels:
        app: laravel
    spec:
      containers:
        - name: laravel
          image: laravel-demo:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          env:
            - name: APP_KEY
              value: "base64:LMwsBco8fTvpLOix6qYa+yf44xdMBra4mqp4+LNWAT0="
            - name: APP_ENV
              value: production
            - name: APP_DEBUG
              value: "false"
            - name: DB_CONNECTION
              value: sqlite
            - name: DB_DATABASE
              value: /var/www/html/database/database.sqlite
---
apiVersion: v1
kind: Service
metadata:
  name: laravel-service
spec:
  type: NodePort
  selector:
    app: laravel
  ports:
    - port: 80
      targetPort: 8000
      nodePort: 30080

